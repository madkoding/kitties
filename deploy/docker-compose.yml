# The gateway as a server, with Caddy in front for https:
#
#   sudo install -d -o 10001 /var/lib/kitties   # the gateway's state, owned by its user
#   cp deploy/.env.example deploy/.env           # set the domain and the token
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# The gateway starts a container per kitty through the host's docker socket, so the socket is
# mounted and the container joins its group (DOCKER_GID). That socket is root on the host: keep
# the gateway behind its token, and read docs/DEPLOY.md before exposing it.

services:
  kitties:
    image: ghcr.io/madkoding/kitties:latest
    restart: unless-stopped
    # Watched by the optional "autoupdate" service below (and only this one).
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      KITTIES_TOKEN: ${KITTIES_TOKEN:?set KITTIES_TOKEN in deploy/.env}
      KITTIES_PUBLIC_URL: https://${KITTIES_DOMAIN:?set KITTIES_DOMAIN in deploy/.env}
      KITTIES_TRUST_PROXY: "true"
      # The kitties' containers mount their workspaces by host path, so the data lives at the
      # same path inside and outside this container.
      KITTIES_DATA_DIR: ${KITTIES_DATA:-/var/lib/kitties}
      # Provider keys the models of your configuration read; add the ones you use.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - ${KITTIES_DATA:-/var/lib/kitties}:${KITTIES_DATA:-/var/lib/kitties}
      - /var/run/docker.sock:/var/run/docker.sock
    # Only Caddy reaches it; nothing is published on the host.
    expose:
      - "7488"
    command: ["gateway"]

  # Keeps the gateway's own image up to date: a container cannot replace itself, so this checks the
  # registry and recreates it when a newer one is out. Optional: docker compose --profile autoupdate up -d
  # It watches only containers with the label above (not the kitties' desktops: the gateway looks
  # after those, with their sessions backed up), and runs on a schedule (KITTIES_UPDATE_CRON, six
  # fields, 03:00 by default). It reaches the docker socket, as the gateway does.
  watchtower:
    image: containrrr/watchtower:1.7.1
    profiles: ["autoupdate"]
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: ${KITTIES_UPDATE_CRON:-0 0 3 * * *}
      WATCHTOWER_ROLLING_RESTART: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - kitties
    ports:
      - "80:80"
      - "443:443"
    environment:
      KITTIES_DOMAIN: ${KITTIES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
