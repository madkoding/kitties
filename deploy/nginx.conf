# nginx in front of a gateway on the same machine (KITTIES_LISTEN=127.0.0.1:7488 and
# gateway.trust_proxy: true, or KITTIES_PUBLIC_URL=https://kitties.example.com).
# Certificates: certbot --nginx -d kitties.example.com
server {
    listen 80;
    server_name kitties.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kitties.example.com;
    ssl_certificate     /etc/letsencrypt/live/kitties.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitties.example.com/privkey.pem;

    client_max_body_size 20m;   # artifacts and files the kitties are given

    location / {
        proxy_pass http://127.0.0.1:7488;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Live chat events (server-sent events) must not be buffered or cut.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
