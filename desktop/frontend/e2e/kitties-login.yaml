# A second demo gateway for the sign-in test: it hands its token to nobody, so the page has to
# ask for it and trade it for a session cookie, as a gateway served on a network does.
data_dir: desktop/frontend/e2e/.data-login
providers:
  strong:
    kind: custom
    model: scripted
    base_url: http://127.0.0.1:1
default_provider: strong
kitties:
  - name: mimi
    avatar: { breed: tabby, color: orange }
gateway:
  listen: 127.0.0.1:7497
  token: login-e2e-token
  local_token: false
  public_url: http://127.0.0.1:4198   # where the page is reached from, as behind a proxy
