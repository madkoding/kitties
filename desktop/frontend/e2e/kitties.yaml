# The fleet the end-to-end test runs: demo mode (a scripted brain, a drawn desktop), on
# ports of its own so a gateway a person runs is left alone.
data_dir: desktop/frontend/e2e/.data
providers:
  strong:
    kind: custom
    model: scripted
    base_url: http://127.0.0.1:1
  local:
    kind: custom
    model: scripted
    base_url: http://127.0.0.1:1
default_provider: strong
kitties:
  - name: mimi
    avatar: {breed: tabby, color: orange}
    soul:
      persona: a patient researcher who loves to explain
      tone: warm and precise
      traits: [curious, thorough]
      skills: [research, summaries]
  - name: tom
    provider: local
    avatar: {breed: tuxedo, color: black}
    soul:
      persona: a hands-on engineer who tries things on the desktop before answering
      tone: friendly and direct
      traits: [practical, honest about what did not work]
      skills: [browsing, testing web apps]
  - name: luna
    desktop: false
    avatar: {breed: fluffy, color: lilac}
    soul:
      persona: a planner who keeps the team on track
      tone: calm and structured
      skills: [planning, reviews]
gateway:
  listen: 127.0.0.1:7498
  token: e2e-token
