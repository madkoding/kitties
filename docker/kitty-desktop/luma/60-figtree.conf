<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Figtree's variable font names itself "Figtree Light" (its default instance); "Figtree" is
     the name everything else asks for, and Luma's. -->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>Figtree</string></test>
    <edit name="family" mode="assign" binding="same"><string>Figtree Light</string></edit>
  </match>
</fontconfig>
