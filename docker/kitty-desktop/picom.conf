# picom for the kitty's desktop: only what the transparencies need, nothing that costs a frame.
# The display is Xvfb (no GPU), so the backend is xrender; glx would need software GL on every
# frame voxl sends. No shadows, fading or blur: each is CPU on a display that is encoded as H.264.
backend = "xrender";
vsync = false;
use-damage = true;

shadow = false;
fading = false;
blur-background = false;

# honour what programs ask for (_NET_WM_WINDOW_OPACITY, ARGB visuals: menus, tooltips, the shelf)
detect-client-opacity = true;
inactive-opacity = 1.0;
frame-opacity = 1.0;
