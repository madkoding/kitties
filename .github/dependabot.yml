# Updates arrive as pull requests, so the CI and the security checks look at them like at any
# other change. Weekly, grouped, to keep the noise down.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: gomod
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      go-desktop:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directory: /docker/gateway
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: docker
    directory: /docker/kitty-desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
