name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt · vet · test · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go test -race
        run: make test
      - name: coverage gate
        run: make cover

  build:
    name: cross-platform build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build every platform
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: kitties-binaries
          path: dist/
          retention-days: 7

  image:
    name: kitty-desktop image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: shell scripts parse
        run: for f in docker/kitty-desktop/*.sh; do sh -n "$f"; done
      - name: build the image
        run: docker build -t kitty-desktop:ci docker/kitty-desktop
      - name: the display comes up and a screenshot is a PNG
        run: |
          docker run -d --name kitty-ci -e KITTY_NAME=ci kitty-desktop:ci
          sleep 5
          docker exec kitty-ci kitty-shot > shot.png
          head -c 8 shot.png | od -An -c | grep -q 'P   N   G'
          docker rm -f kitty-ci

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make VERSION=${{ github.ref_name }} dist
      - run: cd dist && sha256sum kitties-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kitties-*
            dist/SHA256SUMS
          generate_release_notes: true
