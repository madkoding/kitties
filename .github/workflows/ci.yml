name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request (or branch): a new push cancels the one still going. The group used to end
# in the commit's SHA, so every push had a group of its own and nothing was ever cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request touches. A pull request that changes only docs or the landing skips the heavy
  # jobs, and one that changes only the kitty-desktop image skips the app's. Skipped jobs count as
  # passed for the required checks, and keep their (static) names. Pushes, tags, schedules and manual
  # runs always run everything. Matrix jobs with a templated name must not be skipped at the job level
  # (their required name would never be reported): they decide in a step instead.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      desktop_image: ${{ steps.scope.outputs.desktop_image }}
      page: ${{ steps.scope.outputs.page }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "desktop_image=true" >> "$GITHUB_OUTPUT"; echo "page=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # HEAD is the merge of the pull request into its base: its first parent is the base.
          files="$(git diff --name-only HEAD^1 HEAD)"
          echo "$files"
          # The app side: anything but docs, the landing and the kitty-desktop image's own folder.
          if printf '%s\n' "$files" | grep -qvE '^(docs/|site/|docker/kitty-desktop/)|\.md$|^LICENSE$'; then app=true; else app=false; fi
          # The image: its folder, the fonts it shares with the page, and the workflows that build and scan it.
          if printf '%s\n' "$files" | grep -qE '^(docker/kitty-desktop/|desktop/frontend/public/|\.github/workflows/(ci|security)\.yml$)'; then img=true; else img=false; fi
          # The page on macOS and Windows: the desktop app's page and the workflow that builds it.
          if printf '%s\n' "$files" | grep -qE '^(desktop/frontend/|\.github/workflows/ci\.yml$)'; then page=true; else page=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"; echo "desktop_image=$img" >> "$GITHUB_OUTPUT"; echo "page=$page" >> "$GITHUB_OUTPUT"

  check:
    name: fmt · vet · test · coverage
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The modules (WhatsApp's whatsmeow) and the build cache, keyed by the root module's go.sum.
          cache-dependency-path: go.sum
      # macOS and Windows builds see Library.tsx and library.ts as one file: no two paths may differ
      # only in case (that broke the v0.59.0 and v0.60.0 desktop builds).
      - name: no paths that differ only in case
        run: scripts/case-collisions.sh
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: release scripts
        run: scripts/next-version_test.sh
      # One pass: the tests with the race detector, and the coverage gate read from the same run
      # (they used to run twice, `make test` and then `make cover`).
      - name: go test -race and coverage gate
        run: make test-cover

  build:
    name: cross-platform build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Independent of `check` (it used to wait for it): both run at once.
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Its own cache key (the Makefile lists the platforms): the seven GOOS/GOARCH builds of the
          # standard library are what took most of this job.
          cache-dependency-path: |
            go.sum
            Makefile
      # `make dist` builds the page into the binaries (WEB=1), so it needs Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: build every platform
        run: make dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitties-binaries
          path: dist/
          retention-days: 7

  desktop:
    name: desktop app · page · wails module
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: build the page
        run: cd desktop/frontend && npm ci && npm run typecheck && npm test && npm run build
      # The built page is built once, here, and the Android and end to end jobs take it from this artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page
          path: desktop/frontend/dist/
          retention-days: 1
      - name: vet and test the Wails module
        run: cd desktop && go vet ./... && go test -count=1 -cover ./...

  # The page built on macOS and Windows, whose file systems ignore case: what the release's wails
  # builds would trip on is seen on the pull request, without building the whole app there.
  page-os:
    name: desktop app · page · ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.page == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: build the page
        shell: bash
        run: cd desktop/frontend && npm ci && npm run build

  # Kitties updating itself, with real binaries and a fake GitHub: a signed release is installed and
  # restarted into in place, a bad signature is refused, and a version that does not hold is gone back from.
  selfupdate:
    name: updating itself
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/selfupdate_test.sh
      - run: scripts/install_test.sh   # the one-line installer, against a fake signed release
      - name: the installer as a real systemd service
        run: sudo env "PATH=$PATH" scripts/install_systemd_test.sh   # install, kitties gateway start/stop/restart, run again

  # The Android app: the same page in a WebView, a remote for a gateway on the network. Signed
  # with the KITTIES_KEYSTORE_* secrets when they are set (so an installed app updates), else with
  # a debug key.
  android:
    name: android app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      # The page the `desktop` job built (the APK packs desktop/frontend/dist), not another npm ci + build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page
          path: desktop/frontend/dist
      - name: build the APK
        env:
          KITTIES_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          KITTIES_KEYSTORE_BASE64: ${{ secrets.KITTIES_KEYSTORE_BASE64 }}
          KITTIES_KEYSTORE_PASSWORD: ${{ secrets.KITTIES_KEYSTORE_PASSWORD }}
          KITTIES_KEY_ALIAS: ${{ secrets.KITTIES_KEY_ALIAS }}
        run: |
          if [ -n "$KITTIES_KEYSTORE_BASE64" ]; then
            echo "$KITTIES_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kitties.jks"
            export KITTIES_KEYSTORE_FILE="$RUNNER_TEMP/kitties.jks"
          fi
          cd android && ./gradlew --no-daemon assembleRelease
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk ../out/kitties-android-app.apk
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs ../out/kitties-android-app.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitties-android-app
          path: out/kitties-android-app.apk

  # The desktop app end to end: a demo gateway, the built page and a browser. The screens it
  # checks are photographed into docs/screenshots and kept as an artifact.
  e2e:
    name: desktop app · end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: page
          path: desktop/frontend/dist
      - name: install the test dependencies
        run: cd desktop/frontend && npm ci
      # The browser Playwright downloads, kept per Playwright version (the lockfile): a hit skips the download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('desktop/frontend/package-lock.json') }}
      - name: install the browser
        run: cd desktop/frontend && npx playwright install --with-deps chromium
      - name: run the screens
        run: cd desktop/frontend && npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            desktop/frontend/e2e/report/
            desktop/frontend/e2e/test-results/
          retention-days: 7

  image:
    name: kitty-desktop image
    needs: changes
    if: needs.changes.outputs.desktop_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shell scripts parse
        run: |
          for f in docker/kitty-desktop/*.sh docker/kitty-desktop/test/*.sh; do sh -n "$f"; done
          python3 -m py_compile docker/kitty-desktop/kitty-page.py docker/kitty-desktop/kitty-file.py
      - name: the desktop's fonts are the app's
        run: for f in docker/kitty-desktop/fonts/*.woff2; do cmp "$f" "desktop/frontend/public/$(basename "$f")"; done
      - name: lumen-wm's main (the image always builds it; the commit is also the cache key)
        id: lumen
        run: |
          sha="$(git ls-remote https://github.com/madkoding/lumen-wm.git refs/heads/main | cut -f1)"
          test -n "$sha"
          echo "lumen-wm main is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # The ISO week: the image's apt layer is rebuilt once a week (see APT_REFRESH in the Dockerfile).
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # The image is large (LibreOffice, Rust build of voxl): with BuildKit the layers live in the
      # builder as well as in the daemon, and the runner's disk ran out. Drop what the job does not use.
      - name: free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      # BuildKit with the GitHub cache: every stage is its own layer (voxl's Rust build, the themes and
      # icons, kitty-grab, lumen-wm), so a new lumen-wm commit rebuilds only the lumen stage and its
      # dependants and the rest comes from the cache. Only main and tags write it (a pull request
      # reads it), so the 10 GB cache is not churned by every push. The scope is the one the
      # release build uses, and the security scan reads it too.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/kitty-desktop
          load: true
          tags: kitty-desktop:ci
          build-args: |
            LUMEN_COMMIT=${{ steps.lumen.outputs.sha }}
            APT_REFRESH=${{ steps.lumen.outputs.week }}
          cache-from: type=gha,scope=kitty-desktop-amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=kitty-desktop-amd64' || '' }}
      - name: the shelf's weather and player feeds, and its font
        run: docker run --rm --entrypoint sh -v "$PWD/docker/kitty-desktop/test:/test:ro" kitty-desktop:ci /test/shelf-feeds.sh
      - name: what outlives the container (home, Shared, packages, import)
        run: docker run --rm --entrypoint sh -v "$PWD/docker/kitty-desktop/test:/test:ro" kitty-desktop:ci /test/home.sh
      - name: a desktop on an empty home of the host comes up seeded
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/shared" && chmod 777 "$RUNNER_TEMP/home" "$RUNNER_TEMP/shared"
          docker run -d --name kitty-home -v "$RUNNER_TEMP/home:/home/kitty" -v "$RUNNER_TEMP/shared:/home/kitty/Shared" -e KITTY_NAME=ci kitty-desktop:ci
          sleep 5
          docker exec kitty-home sh -xc 'pgrep -x lumen-wm && test -f ~/.config/lumen/rc.xml && test -f ~/.config/kitties/skel && test -L /opt/kitty-apps && echo hi > ~/Shared/hi.txt && kitty-share --list | grep -qx hi.txt'
          test -f "$RUNNER_TEMP/home/.config/lumen/rc.xml" && test -f "$RUNNER_TEMP/shared/hi.txt"
          docker rm -f kitty-home
      - name: the display comes up and a screenshot is a PNG
        run: |
          docker run -d --name kitty-ci -e KITTY_NAME=ci kitty-desktop:ci
          sleep 5
          docker exec kitty-ci kitty-shot > shot.png
          head -c 8 shot.png | od -An -c | grep -q 'P   N   G'
          docker exec kitty-ci sh -xc 'pgrep -x lumen-wm && pgrep -x pcmanfm && pgrep -x picom && xdpyinfo | grep -q Composite && test -f ~/.config/picom/picom.conf && wmctrl -m && fc-list : family | grep -q Sansation && test -f /usr/share/themes/Numix/openbox-3/themerc && grep -q 353b43 /usr/share/themes/Numix/openbox-3/themerc && grep -q "name>Numix<" ~/.config/lumen/rc.xml && grep -q "enabled>yes<" ~/.config/lumen/rc.xml && test -f /usr/share/icons/Lucide/index.theme && test -f /usr/share/icons/Lucide/small/apps/web-browser.svg && test -f /usr/share/backgrounds/kitties/wallpaper.jpg'
          # Reading the screen (OCR) runs and prints lines of "x,y<TAB>text".
          docker exec kitty-ci kitty-ocr | awk -F'\t' 'NF && $1 !~ /^[0-9]+,[0-9]+$/ { bad = 1 } END { exit bad }'
          # What a kitty keeps (a key, the browser's profile) is backed up and put back, and the browser
          # closes in an orderly way and keeps its session cookies across a restart.
          docker exec kitty-ci sh -c 'test -f /etc/chromium/policies/managed/kitties.json && mkdir -p ~/.ssh && echo k > ~/.ssh/id_ci && mkdir -p ~/.config/kitties && echo p > ~/.config/kitties/pins && kitty-backup | base64 -d > /tmp/b.tgz && tar tzf /tmp/b.tgz | grep -q kitties/pins && tar tzf /tmp/b.tgz | grep -q id_ci && rm -rf ~/.ssh ~/.config/kitties && kitty-restore < /tmp/b.tgz && test -f ~/.ssh/id_ci && test -f ~/.config/kitties/pins'
          # Text for the keyboard (a secret) goes in on the input and is typed.
          printf 'x' | docker exec -i kitty-ci xdotool type --delay 20 --file -
          # A page is read and acted on from the inside, through the browser's DevTools port.
          docker exec kitty-ci sh -c 'printf "<title>ci page</title><button onclick=\"document.title=1\">Go</button>" > /tmp/p.html && kitty-open file:///tmp/p.html >/dev/null && sleep 5 && kitty-page read | grep -q "ci page" && kitty-page click --text Go && sleep 1 && kitty-page read | grep -q "^title: 1"'
          # goto and a click answer with a read of the page after them, and a flow runs its steps and is kept
          # by name (no screenshot needed for any of it).
          docker exec kitty-ci sh -c 'printf "<title>flow</title><input aria-label=Search><p id=r hidden>found it</p><button onclick=\"r.hidden=false\">Find</button>" > /tmp/f.html && (cd /tmp && nohup python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &) && sleep 1 && kitty-page goto http://127.0.0.1:8765/f.html | grep -q "^title: flow" && kitty-page click --text Find | grep -q "^found it" && kitty-page flow --steps "[{\"type\": \"cats\", \"field\": \"Search\"}, {\"click\": \"Find\"}, {\"wait\": \"found it\"}]" --save ci | grep -q "flow finished" && kitty-page flow --list | grep -q ci'
          # Files are read, listed and written as text.
          docker exec kitty-ci sh -c 'printf "one\ntwo\n" | kitty-file write ci/notes.txt && kitty-file read ci/notes.txt | grep -q "2  two" && kitty-file list ci | grep -q notes.txt && ! printf x | kitty-file write /etc/x && command -v pdftotext'
          docker exec kitty-ci kitty-page quit
          # The live stream sends pictures, and ends when its input closes.
          docker exec kitty-ci sh -c 'command -v kitty-grab && ldd "$(command -v kitty-grab)" | grep -vq "not found"'
          sleep 3 | docker exec -i kitty-ci kitty-stream --stdin 4 60 > stream.bin
          head -c 5 stream.bin | grep -q FRAME
          # It stops with its input, and the scrot loop (the fallback) still works.
          sleep 2 | docker exec -i kitty-ci kitty-grab --stdin 20 60 > grab.bin
          head -c 5 grab.bin | grep -q FRAME
          sleep 1
          ! docker exec kitty-ci pgrep kitty-grab
          # voxl, the live view: up on the container's loopback with its own password, streaming the
          # display (a PNG of it), and reachable through the tunnel the gateway uses.
          docker exec kitty-ci sh -c 'command -v voxl && command -v socat && test -s /tmp/voxl.pw && ls -l /tmp/voxl.pw | grep -q "^-rw-------"'
          for _ in $(seq 1 20); do docker exec kitty-ci curl -sf http://127.0.0.1:6901/healthz && break; sleep 1; done
          docker exec kitty-ci python3 -c 'import urllib.request as u; pw = open("/tmp/voxl.pw").read().strip(); r = u.Request("http://127.0.0.1:6901/screenshot", headers={"Authorization": "Bearer " + pw}); assert u.urlopen(r).read(8)[1:4] == b"PNG"'
          # (the request's end of the input stays open a moment: voxl closes a connection whose client has)
          (printf 'GET /healthz HTTP/1.1\r\nHost: 127.0.0.1:6901\r\nConnection: close\r\n\r\n'; sleep 2) | docker exec -i kitty-ci socat - TCP:127.0.0.1:6901 | grep -q '^ok'
          docker rm -f kitty-ci
      - name: the desktop's logs, when a check above failed
        if: failure()
        run: docker exec kitty-ci sh -c 'ps aux; tail -n 40 /tmp/xvfb.log /tmp/lumen.log /tmp/picom.log /tmp/pcmanfm.log /tmp/voxl.log' || true

  # The gateway as a server image: the web page and the binary inside. Built on every push, it
  # proves the Dockerfile and that the container answers its health check.
  gateway-image:
    name: gateway image
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/gateway/Dockerfile
          load: true
          tags: kitties:ci
          cache-from: type=gha,scope=gateway-amd64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=gateway-amd64' || '' }}
      - name: it serves the page and asks for the token
        run: |
          docker run -d --name gw -p 7488:7488 -e KITTIES_TOKEN=ci-token kitties:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7488/v1/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7488/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7488/v1/kitties)" = 401
          curl -sf http://127.0.0.1:7488/ | grep -qi '<div id="root"'
          docker rm -f gw
      - name: the compose file is valid
        run: |
          KITTIES_DOMAIN=kitties.example.com KITTIES_TOKEN=x docker compose -f deploy/docker-compose.yml config -q

  # The desktop app for the three systems, built with the Wails CLI. Linux needs the webkit
  # headers; macOS and Windows build out of the box. The Intel Mac and the arm64 Windows apps are
  # cross-built (no cgo on Windows, clang -arch on macOS); Linux arm64 builds on an arm runner.
  # Only on tags: a Wails build is slow.
  wails:
    name: desktop app · ${{ matrix.name }}
    # On tags, and by hand (Actions → ci → Run workflow) to try the packaging without a release.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [check, desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: build/bin/kitties-desktop
            name: kitties-desktop-linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            out: build/bin/kitties-desktop
            name: kitties-desktop-linux-arm64
            goos: linux
            goarch: arm64
          - os: windows-latest
            out: build/bin/kitties-desktop.exe
            name: kitties-desktop-windows-amd64
            goos: windows
            goarch: amd64
          - os: windows-latest
            out: build/bin/kitties-desktop.exe
            name: kitties-desktop-windows-arm64
            goos: windows
            goarch: arm64
          - os: macos-latest
            out: build/bin/kitties-desktop.app
            name: kitties-desktop-macos-arm64
            goos: darwin
            goarch: arm64
          - os: macos-latest
            out: build/bin/kitties-desktop.app
            name: kitties-desktop-macos-amd64
            goos: darwin
            goarch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: |
            desktop/go.sum
            go.sum
      # A runner that cannot reach proxy.golang.org for a moment (v0.60.1 on macOS) gets a few tries
      # here, so wails build and the gateway build find the modules already downloaded.
      - name: download the Go modules
        shell: bash
        run: |
          for i in 1 2 3 4; do
            (cd desktop && go mod download) && go mod download && exit 0
            echo "::warning::go mod download failed (try $i), retrying in $((i * 10))s"; sleep $((i * 10))
          done
          exit 1
      - name: linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: wails build
        shell: bash
        run: |
          cd desktop
          tags=""; if [ "${{ runner.os }}" = "Linux" ]; then tags="-tags webkit2_41"; fi
          wails build $tags -platform "${{ matrix.goos }}/${{ matrix.goarch }}"
      # The app is a window onto a gateway: the release carries one next to it and the app starts
      # it when none is running (desktop/gateway.go), so nothing else has to be installed.
      # The gateway carries the same page the app shows (what `make web` does, from the page wails
      # build just made): without it a browser on http://127.0.0.1:7488 got the small built-in page.
      - name: build the gateway the app starts
        shell: bash
        env:
          OAUTH_APPS: ${{ secrets.KITTIES_OAUTH_APPS }}
          UPDATE_PUBKEY: ${{ vars.KITTIES_UPDATE_PUBKEY }}
        run: |
          test -f desktop/frontend/dist/index.html
          find internal/web/dist -mindepth 1 ! -name placeholder.txt -delete
          cp -r desktop/frontend/dist/. internal/web/dist/
          test -f internal/web/dist/index.html
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }} -X 'github.com/madkoding/kitties/internal/oauth.builtin=$OAUTH_APPS' -X 'github.com/madkoding/kitties/internal/selfupdate.builtinKey=$UPDATE_PUBKEY'" -o "desktop/build/bin/kitties-gateway$ext" ./cmd/kitties
          grep -q '<div id="root"' "desktop/build/bin/kitties-gateway$ext"
          ls -la desktop/build/bin
      # The gateway the app starts serves the app's own page to a browser, not the spare one.
      - name: the bundled gateway serves the app's page
        if: runner.os == 'Linux'
        run: |
          data="$(mktemp -d)"
          KITTIES_DATA_DIR="$data" KITTIES_LISTEN=127.0.0.1:7499 desktop/build/bin/kitties-gateway gateway > "$data/out.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7499/v1/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7499/ | grep -q '<div id="root"'
          grep -q 'gateway token: ' "$data/out.log"
          kill %1
      - name: pack
        shell: bash
        run: |
          mkdir -p out
          ls -la desktop/build/bin
          # On macOS Wails names the bundle after the product (Kitties.app), not after the
          # output file: take whatever .app it made.
          app="$(find desktop/build/bin -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -n "$app" ]; then
            # The gateway goes inside the app, where the app looks for it, before the bundle is signed.
            cp desktop/build/bin/kitties-gateway "$app/Contents/MacOS/kitties-gateway"
            # An arm64 program must carry a signature to run at all; sign the finished bundle
            # (ad hoc: no Apple account needed) and check it.
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ls -la "$app/Contents/MacOS"
            # The download is a disk image: drag the app to Applications, with a note inside
            # about the first open (desktop/dmg). dmgbuild writes the window's layout directly,
            # so it needs no Finder session.
            dmg="out/${{ matrix.name }}.dmg"
            pretty() {
              set -e
              python3 -m venv "$RUNNER_TEMP/dmg"
              "$RUNNER_TEMP/dmg/bin/pip" install --quiet "dmgbuild>=1.6,<2"
              tiffutil -cathidpicheck desktop/dmg/background.png desktop/dmg/background@2x.png -out "$RUNNER_TEMP/background.tiff"
              args=(-D "app=$app" -D "background=$RUNNER_TEMP/background.tiff")
              icns="$(find "$app/Contents/Resources" -name '*.icns' | head -n 1)"
              if [ -n "$icns" ]; then args+=(-D "icon=$icns"); fi
              "$RUNNER_TEMP/dmg/bin/dmgbuild" -s desktop/dmg/settings.py "${args[@]}" Kitties "$dmg"
            }
            # The layout is a nicety: if it cannot be made, a plain image with the same three
            # things still ships rather than no macOS download at all.
            if ! (pretty); then
              echo "::warning::the styled disk image failed; making a plain one"
              rm -f "$dmg"
              stage="$RUNNER_TEMP/stage"; rm -rf "$stage"; mkdir -p "$stage"
              cp -R "$app" "$stage/"
              cp "desktop/dmg/READ ME FIRST.txt" "$stage/"
              ln -s /Applications "$stage/Applications"
              hdiutil create -volname Kitties -srcfolder "$stage" -ov -format UDZO "$dmg"
            fi
            hdiutil verify "$dmg"
            # Open it and check what a person will find.
            mnt="$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}')"
            ls -la "$mnt"
            test -d "$mnt/$(basename "$app")"
            test -e "$mnt/Applications"
            test -f "$mnt/READ ME FIRST.txt"
            hdiutil detach "$mnt"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # Windows: an installer (per user, no administrator) that puts the app and its gateway
            # side by side, adds the Start menu entry and the uninstaller, and installs the WebView2
            # runtime when the machine lacks it (desktop/windows/installer.nsi).
            if ! command -v makensis >/dev/null 2>&1; then
              choco install nsis -y --no-progress
              export PATH="$PATH:/c/Program Files (x86)/NSIS"
            fi
            args=(-V2 "-DARCH=${{ matrix.goarch }}" "-DVERSION=${{ github.ref_name }}" "-DBIN=$(cygpath -w "$PWD/desktop/build/bin")" "-DOUT=$(cygpath -w "$PWD/out/${{ matrix.name }}-setup.exe")")
            ico="$(find desktop/build -name '*.ico' | head -n 1)"
            if [ -n "$ico" ]; then args+=("-DICON=$(cygpath -w "$PWD/$ico")"); fi
            makensis "${args[@]}" "$(cygpath -w "$PWD/desktop/windows/installer.nsi")"
            test -s "out/${{ matrix.name }}-setup.exe"
          else
            # Linux: the app and its gateway side by side in one zip.
            files=("$(basename "${{ matrix.out }}")" "kitties-gateway")
            if command -v zip >/dev/null 2>&1; then
              (cd desktop/build/bin && zip -q "../../../out/${{ matrix.name }}.zip" "${files[@]}")
            else
              (cd desktop/build/bin && 7z a -bso0 "../../../out/${{ matrix.name }}.zip" "${files[@]}")
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/*
          retention-days: 7

  # The kitty-desktop image, published to GitHub's registry on tags (latest and the version).
  # Each architecture is built on a runner of its own: under QEMU the Rust build of voxl alone
  # took the single multi-arch job past its time limit (v0.36.0), and the release never ran.
  publish-image:
    name: publish kitty-desktop image · ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: lumen-wm's main (the image always builds it; the commit is also the cache key)
        id: lumen
        run: |
          sha="$(git ls-remote https://github.com/madkoding/lumen-wm.git refs/heads/main | cut -f1)"
          test -n "$sha"
          echo "lumen-wm main is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # The ISO week: the image's apt layer is rebuilt once a week (see APT_REFRESH in the Dockerfile).
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/kitty-desktop
          push: true
          build-args: |
            LUMEN_COMMIT=${{ steps.lumen.outputs.sha }}
            APT_REFRESH=${{ steps.lumen.outputs.week }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=kitty-desktop-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kitty-desktop-${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository_owner }}/kitty-desktop:${{ github.ref_name }}-${{ matrix.arch }}

  # One tag for both architectures: latest and the version point at the two images above.
  publish-image-manifest:
    name: publish kitty-desktop manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: join the two architectures
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kitty-desktop
          VERSION: ${{ github.ref_name }}
        run: |
          for tag in "$VERSION" latest; do
            docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          done

  # The gateway image, published next to the kitty-desktop one on tags.
  publish-gateway-image:
    name: publish gateway image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gateway-image, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kitties:latest
            ghcr.io/${{ github.repository_owner }}/kitties:${{ github.ref_name }}

  # The only job that publishes a release, and it runs for a pushed tag and nothing else: not
  # for a branch, a pull request or a manual run. Everything else above only checks and builds.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, wails, android, selfupdate, publish-image-manifest, publish-gateway-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The same key as the build job: the release reuses the cross-compiled standard library.
          cache-dependency-path: |
            go.sum
            Makefile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: make VERSION=${{ github.ref_name }} OAUTH_APPS="$OAUTH_APPS" UPDATE_PUBKEY="$UPDATE_PUBKEY" dist
        env:
          # The apps Kitties signs in through (a repository secret; empty: the person's own).
          OAUTH_APPS: ${{ secrets.KITTIES_OAUTH_APPS }}
          # The public key the releases are signed with (a repository variable: it is not a secret).
          # A gateway built with it only installs updates signed by the matching private key.
          UPDATE_PUBKEY: ${{ vars.KITTIES_UPDATE_PUBKEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kitties-desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kitties-android-app
          path: dist
      - run: cd dist && sha256sum kitties-* > SHA256SUMS
      # What the updater of a gateway looks for: kitties-<os>-<arch> of every system and the signed
      # checksums. The private key is the repository secret KITTIES_SIGNING_KEY (kitties release-key
      # makes the pair); without it the release is unsigned, and a gateway that holds the key will
      # not install it.
      - name: sign the checksums and check what the updater needs
        env:
          KITTIES_SIGNING_KEY: ${{ secrets.KITTIES_SIGNING_KEY }}
          UPDATE_PUBKEY: ${{ vars.KITTIES_UPDATE_PUBKEY }}
        run: |
          for p in linux-amd64 linux-arm64 linux-arm darwin-amd64 darwin-arm64 windows-amd64.exe windows-arm64.exe; do
            grep -q "  kitties-$p\$" dist/SHA256SUMS || { echo "::error::SHA256SUMS does not list kitties-$p"; exit 1; }
          done
          if [ -n "$KITTIES_SIGNING_KEY" ]; then
            dist/kitties-linux-amd64 release-sign dist/SHA256SUMS
            if [ -n "$UPDATE_PUBKEY" ]; then
              dist/kitties-linux-amd64 release-verify dist/SHA256SUMS dist/SHA256SUMS.sig "$UPDATE_PUBKEY"
            else
              echo "::warning::KITTIES_UPDATE_PUBKEY is not set: the signature was not checked and the binaries do not hold the key"
            fi
          else
            echo "::warning::KITTIES_SIGNING_KEY is not set: this release is unsigned"
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/kitties-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          generate_release_notes: true
          body: |
            ## Which file do I download?

            | You have | Download |
            | --- | --- |
            | Windows | `kitties-desktop-windows-amd64-setup.exe` (`-arm64-` on an Arm PC): run it |
            | macOS | `kitties-desktop-macos-arm64.dmg` (Apple silicon) or `-amd64.dmg` (Intel) |
            | Linux | `kitties-desktop-linux-amd64.zip` (or `-arm64`): unzip and run `kitties-desktop` |
            | Android | `kitties-android-app.apk` |
            | A server | `kitties-<system>-<arch>` is the command-line gateway; you do not need it for the desktop app |

            The desktop apps carry their own gateway. `SHA256SUMS` lists every file.
