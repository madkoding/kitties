name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt · vet · test · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: go test -race
        run: make test
      - name: coverage gate
        run: make cover

  build:
    name: cross-platform build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: build every platform
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: kitties-binaries
          path: dist/
          retention-days: 7

  desktop:
    name: desktop app · page · wails module
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: build the page
        run: cd desktop/frontend && npm ci && npm run typecheck && npm run build
      - name: vet and test the Wails module
        run: cd desktop && go vet ./... && go test -count=1 -cover ./...

  # The desktop app end to end: a demo gateway, the built page and a browser. The screens it
  # checks are photographed into docs/screenshots and kept as an artifact.
  e2e:
    name: desktop app · end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the page
        run: cd desktop/frontend && npm ci && npm run build
      - name: install the browser
        run: cd desktop/frontend && npx playwright install --with-deps chromium
      - name: run the screens
        run: cd desktop/frontend && npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            desktop/frontend/e2e/report/
            desktop/frontend/e2e/test-results/
          retention-days: 7

  image:
    name: kitty-desktop image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: shell scripts parse
        run: for f in docker/kitty-desktop/*.sh; do sh -n "$f"; done
      - name: build the image
        run: docker build -t kitty-desktop:ci docker/kitty-desktop
      - name: the display comes up and a screenshot is a PNG
        run: |
          docker run -d --name kitty-ci -e KITTY_NAME=ci kitty-desktop:ci
          sleep 5
          docker exec kitty-ci kitty-shot > shot.png
          head -c 8 shot.png | od -An -c | grep -q 'P   N   G'
          docker rm -f kitty-ci

  # The gateway as a server image: the web page and the binary inside. Built on every push, it
  # proves the Dockerfile and that the container answers its health check.
  gateway-image:
    name: gateway image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -f docker/gateway/Dockerfile -t kitties:ci .
      - name: it serves the page and asks for the token
        run: |
          docker run -d --name gw -p 7488:7488 -e KITTIES_TOKEN=ci-token kitties:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7488/v1/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:7488/v1/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7488/v1/kitties)" = 401
          curl -sf http://127.0.0.1:7488/ | grep -qi '<div id="root"'
          docker rm -f gw
      - name: the compose file is valid
        run: |
          KITTIES_DOMAIN=kitties.example.com KITTIES_TOKEN=x docker compose -f deploy/docker-compose.yml config -q

  # The desktop app for the three systems, built with the Wails CLI. Linux needs the webkit
  # headers; macOS and Windows build out of the box. Only on tags: a Wails build is slow.
  wails:
    name: desktop app · ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: build/bin/kitties-desktop
            name: kitties-desktop-linux-amd64
          - os: windows-latest
            out: build/bin/kitties-desktop.exe
            name: kitties-desktop-windows-amd64.exe
          - os: macos-latest
            out: build/bin/kitties-desktop.app
            name: kitties-desktop-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
      - name: linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: wails build
        shell: bash
        run: |
          cd desktop
          if [ "${{ runner.os }}" = "Linux" ]; then wails build -tags webkit2_41; else wails build; fi
      - name: pack
        shell: bash
        run: |
          mkdir -p out
          ls -la desktop/build/bin
          # On macOS Wails names the bundle after the product (Kitties.app), not after the
          # output file: take whatever .app it made.
          app="$(find desktop/build/bin -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -n "$app" ]; then
            # An arm64 program must carry a signature to run at all; sign the finished bundle
            # (ad hoc: no Apple account needed), then check it and zip it the way macOS does, so
            # the executable bit and the bundle's seal survive.
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ls -la "$app/Contents/MacOS"
            ditto -c -k --keepParent "$app" "out/${{ matrix.name }}.zip"
          else
            cp "desktop/${{ matrix.out }}" "out/${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          retention-days: 7

  # The kitty-desktop image, published to GitHub's registry on tags (latest and the version).
  publish-image:
    name: publish kitty-desktop image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/kitty-desktop
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/kitty-desktop:latest
            ghcr.io/${{ github.repository_owner }}/kitty-desktop:${{ github.ref_name }}

  # The gateway image, published next to the kitty-desktop one on tags.
  publish-gateway-image:
    name: publish gateway image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [gateway-image, check]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kitties:latest
            ghcr.io/${{ github.repository_owner }}/kitties:${{ github.ref_name }}

  # The only job that publishes a release, and it runs for a pushed tag and nothing else: not
  # for a branch, a pull request or a manual run. Everything else above only checks and builds.
  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, wails, publish-image, publish-gateway-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: make VERSION=${{ github.ref_name }} dist
      - uses: actions/download-artifact@v4
        with:
          pattern: kitties-desktop-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum kitties-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kitties-*
            dist/SHA256SUMS
          generate_release_notes: true
