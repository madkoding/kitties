name: security

# What could hurt a person who runs Kitties: known flaws in what it is built from, secrets that
# slipped into the history, and the code's own mistakes. It runs on every push and pull request,
# and once a week, because a flaw can be published about something that was clean yesterday.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go: the standard library and the modules the code really calls, for both modules.
  govulncheck:
    name: go · known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Keeps the modules and build cache (govulncheck and the desktop module's dependencies).
          cache-dependency-path: |
            go.mod
            desktop/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: the gateway and the CLI
        run: govulncheck ./...
      - name: the desktop app
        run: cd desktop && govulncheck ./...

  # The page's packages: what ships (dependencies) must have no high or critical flaw.
  npm-audit:
    name: page · known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cd desktop/frontend && npm audit --omit=dev --audit-level=high

  # A secret in the code or in its history is a secret for everyone who can read it.
  secrets:
    name: secrets in the history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The code's own mistakes (injection, unsafe paths, weak crypto), with GitHub's CodeQL.
  codeql:
    name: codeql · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # A pull request that adds a dependency with a known flaw or a licence that cannot ship.
  dependency-review:
    name: dependencies a pull request adds
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

  # The image's shell scripts, with their own linter.
  shellcheck:
    name: shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck --severity=warning docker/kitty-desktop/*.sh scripts/*.sh

  # The images: the operating system packages and the libraries inside them. Trivy is fetched from
  # its release and checked against a checksum kept here, not run through a third-party action. The
  # base image is pulled anew every time, so the weekly run sees what was published since.
  image-scan:
    name: ${{ matrix.image }} image · known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: .
            file: docker/gateway/Dockerfile
            scope: gateway-amd64
            # Changes that alter the image: anything but docs, the landing and the other image's folder.
            paths: '^(docs/|site/|docker/kitty-desktop/)|\.md$|^LICENSE$'
            invert: "true"
          - image: kitty-desktop
            context: docker/kitty-desktop
            file: docker/kitty-desktop/Dockerfile
            scope: kitty-desktop-amd64
            paths: '^(docker/kitty-desktop/|desktop/frontend/public/|\.github/workflows/(ci|security)\.yml$)'
            invert: "false"
    env:
      TRIVY_VERSION: "0.69.3"
      TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The job always runs (a matrix job with a templated name cannot be skipped without its
      # required check going missing); a pull request that cannot change this image skips the steps.
      # Pushes, the weekly run and manual runs always scan.
      - name: does this change the image?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PATHS: ${{ matrix.paths }}
          INVERT: ${{ matrix.invert }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only HEAD^1 HEAD)"
          if [ "$INVERT" = "true" ]; then
            if printf '%s\n' "$files" | grep -qvE "$PATHS"; then r=true; else r=false; fi
          else
            if printf '%s\n' "$files" | grep -qE "$PATHS"; then r=true; else r=false; fi
          fi
          echo "scan=$r" >> "$GITHUB_OUTPUT"
      - name: install trivy
        if: steps.scope.outputs.scan == 'true'
        run: |
          curl -fsSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
      - name: lumen-wm's main (the kitty-desktop image builds it)
        id: lumen
        if: steps.scope.outputs.scan == 'true' && matrix.image == 'kitty-desktop'
        run: |
          sha="$(git ls-remote https://github.com/madkoding/lumen-wm.git refs/heads/main | cut -f1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.scope.outputs.scan == 'true'
      # Reads the cache the ci workflow writes on main (same scope), so the layers are not built a
      # second time. `pull` keeps the base image fresh: a new base digest misses the cache, which is
      # what the weekly run needs to see what was published since.
      - name: build the image
        if: steps.scope.outputs.scan == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          pull: true
          tags: scan:image
          build-args: ${{ steps.lumen.outputs.sha != '' && format('LUMEN_COMMIT={0}', steps.lumen.outputs.sha) || '' }}
          cache-from: type=gha,scope=${{ matrix.scope }}
      - name: scan it
        if: steps.scope.outputs.scan == 'true'
        run: ./trivy image --skip-version-check --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scan:image
