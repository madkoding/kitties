name: tag

# A green main is released by itself: when ci passes on a push to main, the semantic commits
# since the last tag decide the next version (scripts/next-version.sh); the tag is made, and ci
# is run on it, which publishes the release. A tag pushed with the workflow's own token does not
# start workflows, so ci is started on the tag explicitly. Commits that are no release (docs, ci,
# chore…) make no tag.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag the release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: next version
        id: next
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A commit a newer run already released (or a tag already names) is not tagged again.
          if [ -n "$(git tag --contains "$SHA" --list 'v*')" ]; then
            echo "already released: $(git tag --contains "$SHA" --list 'v*' | head -1)"
            exit 0
          fi
          version="$(scripts/next-version.sh "$SHA")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next version: ${version:-none (no feat, fix, perf or breaking change since the last tag)}"
      - name: tag and release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION" "$SHA"
          git push origin "$VERSION"
          gh workflow run ci.yml --ref "$VERSION"
          echo "tagged $VERSION and started ci on it" >> "$GITHUB_STEP_SUMMARY"
